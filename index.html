<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glens - GitHub insights at a glance</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-color: #ffffff;
        --text-color: #24292f;
        --card-bg: #f6f8fa;
        --border-color: #d0d7de;
        --btn-bg: #2da44e;
        --btn-hover-bg: #1a7f37;
        --btn-text: #ffffff;
        --link-color: #0969da;

        --btn-sec-bg: #f3f4f6;
        --btn-sec-text: #24292f;
        --btn-sec-border: rgba(31, 35, 40, 0.15);
        --btn-sec-hover: #efeff1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --text-color: #c9d1d9;
          --card-bg: #161b22;
          --border-color: #30363d;
          --btn-bg: #238636;
          --btn-hover-bg: #2ea043;
          --btn-text: #ffffff;
          --link-color: #58a6ff;

          --btn-sec-bg: #21262d;
          --btn-sec-text: #c9d1d9;
          --btn-sec-border: #30363d;
          --btn-sec-hover: #30363d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 100%;
        margin: 0;
        padding: 1.5rem 2rem;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        width: 100%;
      }

      input[type="text"] {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-color);
        font-size: 1rem;
      }

      button[type="submit"] {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 1px solid rgba(27, 31, 36, 0.15);
        background-color: var(--btn-bg);
        color: var(--btn-text);
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s ease;
      }

      button[type="submit"]:hover {
        background-color: var(--btn-hover-bg);
      }

      .action-btn {
        padding: 0.35rem 0.75rem;
        font-size: 0.85rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .action-btn.secondary {
        background-color: var(--btn-sec-bg);
        color: var(--btn-sec-text);
        border: 1px solid var(--btn-sec-border);
      }

      .action-btn.secondary:hover {
        background-color: var(--btn-sec-hover);
      }

      .actions-cell {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        overflow: hidden;
      }

      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
      }

      th {
        background-color: var(--bg-color);
      }

      tr.json-row {
        background-color: var(--bg-color);
      }

      tr.json-row pre {
        margin: 0;
        max-height: 300px;
      }

      tr.hidden {
        display: none;
      }

      pre {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 1rem;
        overflow-x: auto;
        max-height: 70vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Glens</h1>
    <h2>Search</h2>
    <form id="search-form">
      <label for="username">GitHub Username:</label>
      <input
        type="text"
        id="username"
        value="jeandecian"
        placeholder="Enter GitHub username"
        required
      />
      <button type="submit">Fetch Repos</button>
    </form>
    <h2>Repositories Table</h2>
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Last Updated</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="repos-table-body">
        <tr>
          <td colspan="3">Loading repositories...</td>
        </tr>
      </tbody>
    </table>
    <h2>Results</h2>
    <pre id="output">Loading repositories...</pre>
    <script type="module">
      class RepositoryFetcher {
        async fetchRepositories(username) {
          throw new Error("Method 'fetchRepositories()' must be implemented.");
        }
      }

      class GitHubApiService extends RepositoryFetcher {
        async fetchRepositories(username) {
          const response = await fetch(
            `https://api.github.com/users/${username}/repos?per_page=100`,
          );
          if (!response.ok) {
            throw new Error(`User not found or error (${response.status})`);
          }
          return await response.json();
        }
      }

      class ViewRenderer {
        constructor(outputElement, tableBodyElement) {
          this.outputElement = outputElement;
          this.tableBodyElement = tableBodyElement;
        }

        renderLoading(username) {
          this.outputElement.textContent = `Fetching repos for ${username}...`;
          this.tableBodyElement.innerHTML = `<tr><td colspan="3">Fetching repos for ${username}...</td></tr>`;
        }

        renderData(data) {
          this.outputElement.textContent = JSON.stringify(data, null, 2);

          if (!data || data.length === 0) {
            this.tableBodyElement.innerHTML = `<tr><td colspan="3">No repositories found.</td></tr>`;
            return;
          }

          this.tableBodyElement.innerHTML = data
            .map((repo, index) => {
              const formattedDate = new Date(
                repo.updated_at,
              ).toLocaleDateString(undefined, {
                year: "numeric",
                month: "short",
                day: "numeric",
              });

              return `
                <tr>
                  <td><a href="${repo.html_url}" target="_blank" rel="noopener noreferrer"><strong>${repo.name}</strong></a></td>
                  <td>${formattedDate}</td>
                  <td>
                    <div class="actions-cell">
                      <button class="action-btn secondary toggle-json-btn" data-index="${index}">View JSON</button>
                    </div>
                  </td>
                </tr>
                <tr id="json-row-${index}" class="json-row hidden">
                  <td colspan="3">
                    <pre>${JSON.stringify(repo, null, 2)}</pre>
                  </td>
                </tr>
              `;
            })
            .join("");

          this.tableBodyElement
            .querySelectorAll(".toggle-json-btn")
            .forEach((button) => {
              button.addEventListener("click", (event) => {
                const { index } = event.currentTarget.dataset;
                const jsonRow = document.getElementById(`json-row-${index}`);
                const isHidden = jsonRow.classList.toggle("hidden");
                event.currentTarget.textContent = isHidden
                  ? "View JSON"
                  : "Hide JSON";
              });
            });
        }

        renderError(message) {
          this.outputElement.textContent = `Error: ${message}`;
          this.tableBodyElement.innerHTML = `<tr><td colspan="3">Error: ${message}</td></tr>`;
        }
      }

      class AppController {
        constructor(fetcher, renderer) {
          this.fetcher = fetcher;
          this.renderer = renderer;
        }

        async loadUserRepos(username) {
          this.renderer.renderLoading(username);
          try {
            const data = await this.fetcher.fetchRepositories(username);
            this.renderer.renderData(data);
          } catch (error) {
            this.renderer.renderError(error.message);
          }
        }
      }

      const form = document.getElementById("search-form");
      const usernameInput = document.getElementById("username");
      const output = document.getElementById("output");
      const tableBody = document.getElementById("repos-table-body");

      const apiService = new GitHubApiService();
      const renderer = new ViewRenderer(output, tableBody);
      const app = new AppController(apiService, renderer);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        if (username) {
          await app.loadUserRepos(username);
        }
      });

      await app.loadUserRepos(usernameInput.value);
    </script>
  </body>
</html>

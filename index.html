<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glens - GitHub insights at a glance</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-color: #ffffff;
        --text-color: #24292f;
        --card-bg: #f6f8fa;
        --border-color: #d0d7de;
        --btn-bg: #2da44e;
        --btn-hover-bg: #1a7f37;
        --btn-text: #ffffff;
        --link-color: #0969da;

        --btn-sec-bg: #f3f4f6;
        --btn-sec-text: #24292f;
        --btn-sec-border: rgba(31, 35, 40, 0.15);
        --btn-sec-hover: #efeff1;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --text-color: #c9d1d9;
          --card-bg: #161b22;
          --border-color: #30363d;
          --btn-bg: #238636;
          --btn-hover-bg: #2ea043;
          --btn-text: #ffffff;
          --link-color: #58a6ff;

          --btn-sec-bg: #21262d;
          --btn-sec-text: #c9d1d9;
          --btn-sec-border: #30363d;
          --btn-sec-hover: #30363d;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 100%;
        margin: 0;
        padding: 1.5rem 2rem;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0;
      }

      .rate-limit-badge {
        font-size: 0.85rem;
        font-weight: 500;
        padding: 0.35rem 0.65rem;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
      }

      form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        width: 100%;
      }

      input[type="text"] {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-color);
        font-size: 1rem;
      }

      button[type="submit"] {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: 1px solid rgba(27, 31, 36, 0.15);
        background-color: var(--btn-bg);
        color: var(--btn-text);
        font-size: 1rem;
        cursor: pointer;
        font-weight: 600;
        transition: background-color 0.2s ease;
      }

      button[type="submit"]:hover {
        background-color: var(--btn-hover-bg);
      }

      .stat-card {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 1rem 1.25rem;
        margin-bottom: 1.5rem;
        display: inline-block;
        min-width: 200px;
      }

      .stat-card .stat-label {
        font-size: 0.85rem;
        color: var(--text-color);
        opacity: 0.8;
        margin-bottom: 0.25rem;
      }

      .stat-card .stat-value {
        font-size: 1.75rem;
        font-weight: 600;
        color: var(--text-color);
      }

      .action-btn {
        display: inline-flex;
        align-items: center;
        padding: 0.35rem 0.75rem;
        font-size: 0.85rem;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        text-decoration: none;
        transition:
          background-color 0.15s ease,
          border-color 0.15s ease;
      }

      .action-btn.secondary {
        background-color: var(--btn-sec-bg);
        color: var(--btn-sec-text);
        border: 1px solid var(--btn-sec-border);
      }

      .action-btn.secondary:hover {
        background-color: var(--btn-sec-hover);
        text-decoration: none;
      }

      .actions-cell {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }

      a {
        color: var(--link-color);
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 1.5rem;
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        overflow: hidden;
      }

      th,
      td {
        padding: 0.75rem 1rem;
        text-align: left;
        border-bottom: 1px solid var(--border-color);
      }

      th {
        background-color: var(--bg-color);
      }

      th.sortable {
        cursor: pointer;
        user-select: none;
        transition: background-color 0.15s ease;
      }

      th.sortable:hover {
        background-color: var(--card-bg);
      }

      .sort-icon {
        margin-left: 0.3rem;
        font-size: 0.75rem;
        opacity: 0.5;
      }

      th.sortable.active .sort-icon {
        opacity: 1;
      }

      tr.json-row {
        background-color: var(--bg-color);
      }

      tr.json-row pre {
        margin: 0;
        max-height: 300px;
      }

      tr.hidden {
        display: none;
      }

      pre {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 1rem;
        overflow-x: auto;
        max-height: 70vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Glens</h1>
      <div id="rate-limit" class="rate-limit-badge">
        API requests remaining (per hour): --
      </div>
    </header>
    <h2>Search</h2>
    <form id="search-form">
      <label for="username">GitHub Username:</label>
      <input
        type="text"
        id="username"
        value="jeandecian"
        placeholder="Enter GitHub username"
        required
      />
      <button type="submit">Fetch Repos</button>
    </form>
    <h2>Statistics</h2>
    <div class="stat-card">
      <div class="stat-label">Total Repositories</div>
      <div class="stat-value" id="repo-count">0</div>
    </div>
    <h2>Repositories Table</h2>
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="name">
            Title <span class="sort-icon" id="sort-name">↕</span>
          </th>
          <th class="sortable" data-sort="updated_at">
            Last Updated <span class="sort-icon" id="sort-updated_at">↕</span>
          </th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="repos-table-body">
        <tr>
          <td colspan="3">Loading repositories...</td>
        </tr>
      </tbody>
    </table>
    <h2>Results</h2>
    <pre id="output">Loading repositories...</pre>
    <script type="module">
      class RepositoryFetcher {
        async fetchRepositories(username) {
          throw new Error("Method 'fetchRepositories()' must be implemented.");
        }
      }

      class GitHubApiService extends RepositoryFetcher {
        async fetchRepositories(username) {
          let allRepos = [];
          let page = 1;
          let rateLimit = null;

          while (true) {
            const response = await fetch(
              `https://api.github.com/users/${username}/repos?per_page=100&page=${page}`,
            );

            rateLimit = {
              remaining: response.headers.get("x-ratelimit-remaining"),
              limit: response.headers.get("x-ratelimit-limit"),
              reset: response.headers.get("x-ratelimit-reset"),
            };

            if (!response.ok) {
              const error = new Error(
                `User not found or error (${response.status})`,
              );
              error.rateLimit = rateLimit;
              throw error;
            }

            const pageData = await response.json();

            if (!Array.isArray(pageData) || pageData.length === 0) {
              break;
            }

            allRepos = allRepos.concat(pageData);

            if (pageData.length < 100) {
              break;
            }

            page++;
          }

          return { data: allRepos, rateLimit };
        }
      }

      class ViewRenderer {
        constructor(
          outputElement,
          tableBodyElement,
          rateLimitElement,
          repoCountElement,
        ) {
          this.outputElement = outputElement;
          this.tableBodyElement = tableBodyElement;
          this.rateLimitElement = rateLimitElement;
          this.repoCountElement = repoCountElement;
        }

        renderRateLimit(rateLimit) {
          if (rateLimit && rateLimit.remaining !== null) {
            let resetText = "";
            if (rateLimit.reset) {
              const resetMs = Number.parseInt(rateLimit.reset, 10) * 1000;
              const now = Date.now();
              const diffMinutes = Math.max(
                0,
                Math.ceil((resetMs - now) / 60000),
              );

              const resetTimeStr = new Date(resetMs).toLocaleTimeString([], {
                hour: "2-digit",
                minute: "2-digit",
              });

              resetText = ` (resets in ${diffMinutes}m at ${resetTimeStr})`;
            }

            this.rateLimitElement.textContent = `API requests remaining: ${rateLimit.remaining} / ${rateLimit.limit}${resetText}`;
          }
        }

        renderLoading(username) {
          this.outputElement.textContent = `Fetching repos for ${username}...`;
          this.tableBodyElement.innerHTML = `<tr><td colspan="3">Fetching repos for ${username}...</td></tr>`;
          this.rateLimitElement.textContent = `API requests remaining: Fetching...`;
          this.repoCountElement.textContent = "-";
        }

        renderSortIndicators(currentField, currentDirection) {
          document.querySelectorAll("th.sortable").forEach((th) => {
            const field = th.dataset.sort;
            const icon = th.querySelector(".sort-icon");
            if (field === currentField) {
              th.classList.add("active");
              icon.textContent = currentDirection === "asc" ? "▲" : "▼";
            } else {
              th.classList.remove("active");
              icon.textContent = "↕";
            }
          });
        }

        renderData(data) {
          this.repoCountElement.textContent = data ? data.length : 0;
          this.outputElement.textContent = JSON.stringify(data, null, 2);

          if (!data || data.length === 0) {
            this.tableBodyElement.innerHTML = `<tr><td colspan="3">No repositories found.</td></tr>`;
            return;
          }

          this.tableBodyElement.innerHTML = data
            .map((repo, index) => {
              const formattedDate = new Date(
                repo.updated_at,
              ).toLocaleDateString(undefined, {
                year: "numeric",
                month: "short",
                day: "numeric",
              });

              const rowId = repo.id || index;

              let pagesUrl = null;
              if (repo.homepage && repo.homepage.trim().startsWith("http")) {
                pagesUrl = repo.homepage.trim();
              } else if (repo.has_pages && repo.owner && repo.owner.login) {
                pagesUrl = `https://${repo.owner.login}.github.io/${repo.name}/`;
              }

              const pageButtonHtml = pagesUrl
                ? `<a href="${pagesUrl}" target="_blank" rel="noopener noreferrer" class="action-btn secondary">Open Page ↗</a>`
                : "";

              return `
                <tr>
                  <td><a href="${repo.html_url}" target="_blank" rel="noopener noreferrer"><strong>${repo.name}</strong></a></td>
                  <td>${formattedDate}</td>
                  <td>
                    <div class="actions-cell">
                      ${pageButtonHtml}
                      <button class="action-btn secondary toggle-json-btn" data-row-id="${rowId}">View JSON</button>
                    </div>
                  </td>
                </tr>
                <tr id="json-row-${rowId}" class="json-row hidden">
                  <td colspan="3">
                    <pre>${JSON.stringify(repo, null, 2)}</pre>
                  </td>
                </tr>
              `;
            })
            .join("");

          this.tableBodyElement
            .querySelectorAll(".toggle-json-btn")
            .forEach((button) => {
              button.addEventListener("click", (event) => {
                const { rowId } = event.currentTarget.dataset;
                const jsonRow = document.getElementById(`json-row-${rowId}`);
                const isHidden = jsonRow.classList.toggle("hidden");
                event.currentTarget.textContent = isHidden
                  ? "View JSON"
                  : "Hide JSON";
              });
            });
        }

        renderError(message) {
          this.outputElement.textContent = `Error: ${message}`;
          this.tableBodyElement.innerHTML = `<tr><td colspan="3">Error: ${message}</td></tr>`;
          this.repoCountElement.textContent = "0";
        }
      }

      class AppController {
        constructor(fetcher, renderer) {
          this.fetcher = fetcher;
          this.renderer = renderer;
          this.repositories = [];
          this.sortField = "name";
          this.sortDirection = "asc";
        }

        handleSortClick(field) {
          if (this.sortField === field) {
            this.sortDirection = this.sortDirection === "asc" ? "desc" : "asc";
          } else {
            this.sortField = field;
            this.sortDirection = field === "name" ? "asc" : "desc";
          }
          this.applySort();
        }

        applySort() {
          const modifier = this.sortDirection === "asc" ? 1 : -1;
          this.repositories.sort((a, b) => {
            let valA = a[this.sortField];
            let valB = b[this.sortField];

            if (this.sortField === "updated_at") {
              valA = new Date(valA).getTime();
              valB = new Date(valB).getTime();
            } else if (typeof valA === "string") {
              return valA.localeCompare(valB) * modifier;
            }

            if (valA < valB) return -1 * modifier;
            if (valA > valB) return 1 * modifier;
            return 0;
          });

          this.renderer.renderSortIndicators(
            this.sortField,
            this.sortDirection,
          );
          this.renderer.renderData(this.repositories);
        }

        async loadUserRepos(username) {
          this.renderer.renderLoading(username);
          try {
            const { data, rateLimit } =
              await this.fetcher.fetchRepositories(username);
            this.repositories = data || [];
            this.renderer.renderRateLimit(rateLimit);
            this.applySort();
          } catch (error) {
            if (error.rateLimit) {
              this.renderer.renderRateLimit(error.rateLimit);
            }
            this.renderer.renderError(error.message);
          }
        }
      }

      const form = document.getElementById("search-form");
      const usernameInput = document.getElementById("username");
      const output = document.getElementById("output");
      const tableBody = document.getElementById("repos-table-body");
      const rateLimitBadge = document.getElementById("rate-limit");
      const repoCount = document.getElementById("repo-count");

      const apiService = new GitHubApiService();
      const renderer = new ViewRenderer(
        output,
        tableBody,
        rateLimitBadge,
        repoCount,
      );
      const app = new AppController(apiService, renderer);

      document.querySelectorAll("th.sortable").forEach((th) => {
        th.addEventListener("click", () => {
          app.handleSortClick(th.dataset.sort);
        });
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        if (username) {
          await app.loadUserRepos(username);
        }
      });

      await app.loadUserRepos(usernameInput.value);
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Glens - GitHub insights at a glance</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg-color: #ffffff;
        --text-color: #24292f;
        --card-bg: #f6f8fa;
        --border-color: #d0d7de;
        --btn-bg: #2da44e;
        --btn-text: #ffffff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0d1117;
          --text-color: #c9d1d9;
          --card-bg: #161b22;
          --border-color: #30363d;
          --btn-bg: #238636;
          --btn-text: #ffffff;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 100%;
        margin: 0;
        padding: 1.5rem 2rem;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      form {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
        width: 100%;
      }

      input[type="text"] {
        flex: 1;
        padding: 0.5rem 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border-color);
        background-color: var(--card-bg);
        color: var(--text-color);
        font-size: 1rem;
      }

      button {
        padding: 0.5rem 1rem;
        border-radius: 6px;
        border: none;
        background-color: var(--btn-bg);
        color: var(--btn-text);
        font-size: 1rem;
        cursor: pointer;
        font-weight: 500;
      }

      pre {
        background-color: var(--card-bg);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 1rem;
        overflow-x: auto;
        max-height: 70vh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <h1>Glens</h1>
    <h2>Search</h2>
    <form id="search-form">
      <label for="username">GitHub Username:</label>
      <input
        type="text"
        id="username"
        value="jeandecian"
        placeholder="Enter GitHub username"
        required
      />
      <button type="submit">Fetch Repos</button>
    </form>
    <h2>Results</h2>
    <pre id="output">Loading repositories...</pre>
    <script type="module">
      class RepositoryFetcher {
        async fetchRepositories(username) {
          throw new Error("Method 'fetchRepositories()' must be implemented.");
        }
      }

      class GitHubApiService extends RepositoryFetcher {
        async fetchRepositories(username) {
          const response = await fetch(
            `https://api.github.com/users/${username}/repos?per_page=100`,
          );
          if (!response.ok) {
            throw new Error(`User not found or error (${response.status})`);
          }
          return await response.json();
        }
      }

      class ViewRenderer {
        constructor(outputElement) {
          this.outputElement = outputElement;
        }

        renderLoading(username) {
          this.outputElement.textContent = `Fetching repos for ${username}...`;
        }

        renderData(data) {
          this.outputElement.textContent = JSON.stringify(data, null, 2);
        }

        renderError(message) {
          this.outputElement.textContent = `Error: ${message}`;
        }
      }

      class AppController {
        constructor(fetcher, renderer) {
          this.fetcher = fetcher;
          this.renderer = renderer;
        }

        async loadUserRepos(username) {
          this.renderer.renderLoading(username);
          try {
            const data = await this.fetcher.fetchRepositories(username);
            this.renderer.renderData(data);
          } catch (error) {
            this.renderer.renderError(error.message);
          }
        }
      }

      const form = document.getElementById("search-form");
      const usernameInput = document.getElementById("username");
      const output = document.getElementById("output");

      const apiService = new GitHubApiService();
      const renderer = new ViewRenderer(output);
      const app = new AppController(apiService, renderer);

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = usernameInput.value.trim();
        if (username) {
          await app.loadUserRepos(username);
        }
      });

      await app.loadUserRepos(usernameInput.value);
    </script>
  </body>
</html>
